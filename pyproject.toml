[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-management-simulator"
version = "0.1.0"
description = "Controlled multi-agent software project management laboratory"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.54,<1", "sqlalchemy>=2.0,<2.1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "alembic>=1.18,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["migration_versions/*.py", "migration_versions/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
